name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check pathwayagent testing/conftest.py testing/unit testing/validation testing/live testing/package_smoke.py

      - name: Offline tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          python -m pytest -m "not live" -ra

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify installed wheel outside source tree
        run: |
          python -m venv /tmp/pathwayagent-wheel
          /tmp/pathwayagent-wheel/bin/python -m pip install dist/*.whl httpx
          cd "$RUNNER_TEMP"
          /tmp/pathwayagent-wheel/bin/pathwayagent --help
          /tmp/pathwayagent-wheel/bin/python "$GITHUB_WORKSPACE/testing/package_smoke.py"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
